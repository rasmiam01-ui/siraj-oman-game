<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كلماتي العُمانية | سراج عُمان</title><style>body{font-family:Tahoma,Arial;background:linear-gradient(135deg,#e9f7f1,#fff5e5);margin:0;color:#183b32}.wrap{max-width:740px;margin:24px auto;padding:20px}.panel{background:white;border-radius:24px;padding:25px;box-shadow:0 8px 28px #174b3320;text-align:center}h1{color:#a52532}button{border:0;background:#08765a;color:white;border-radius:14px;padding:13px 22px;font-size:19px;cursor:pointer;margin:7px}button:hover{background:#095840}.letter{background:#fff3d6;color:#6e3c16;font-weight:bold;min-width:50px}.slot{display:inline-flex;align-items:center;justify-content:center;min-width:43px;height:54px;margin:5px;border:2px dashed #baac8c;border-radius:12px;font-size:27px;background:#faf8f3}.muted{color:#5b6d67}.hidden{display:none}.score{font-size:19px;font-weight:bold}.feedback{min-height:32px;font-size:20px;font-weight:bold}footer{margin-top:22px;font-size:13px;color:#65766c}</style></head><body><div class="wrap"><div class="panel"><h1>🇴🇲 كلماتي العُمانية</h1><p>تطبيق تعليمي تفاعلي ضمن مشروع سِراج عُمان</p><p class="muted">رتّب الحروف لتكوين كلمة عن معالم عُمان وتراثها.</p><div class="score" id="score">النقاط: 0 | السؤال: 1 من 8</div><h2 id="hint"></h2><div id="slots"></div><div id="letters"></div><div><button onclick="clearAnswer()">↻ إعادة المحاولة</button><button onclick="check()">✓ تحقق</button></div><p class="feedback" id="feedback" aria-live="polite"></p><button id="next" class="hidden" onclick="next()">السؤال التالي ←</button><div id="finish" class="hidden"><h2>🎉 أحسنت!</h2><p id="result"></p><input id="student" placeholder="اسم الطالب (اختياري)" style="padding:12px;border-radius:10px;border:1px solid #ccc;font-size:17px;max-width:90%"><p><button onclick="certificate()">عرض شهادة المشاركة</button><button onclick="restart()">العب مرة أخرى</button></p></div><footer>مدرسة العهد للتعليم الأساسي (1–4) | مشروع سِراج عُمان</footer></div></div><script>const data=[['قلعة تاريخية شهيرة في ولاية الرستاق','الرستاق'],['حصن مشهور في ولاية الرستاق','الحزم'],['عاصمة سلطنة عُمان','مسقط'],['لباس تقليدي يرتديه الرجال في عُمان','دشداشة'],['سلاح تراثي عُماني يُلبس في المناسبات','خنجر'],['وسيلة بحرية ارتبطت بتاريخ عُمان','سفينة'],['شجرة تشتهر بها محافظة ظفار','لبان'],['لون في علم سلطنة عُمان يرمز للسلام','أبيض']];let index=0,points=0,chosen=[],pool=[],solved=false;const el=x=>document.getElementById(x);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function render(){let word=data[index][1];el('score').textContent=`النقاط: ${points} | السؤال: ${index+1} من ${data.length}`;el('hint').textContent='💡 '+data[index][0];pool=shuffle([...word]);chosen=[];solved=false;el('feedback').textContent='';el('next').classList.add('hidden');draw()}function draw(){el('slots').innerHTML='';[...data[index][1]].forEach((_,i)=>{let d=document.createElement('span');d.className='slot';d.textContent=chosen[i]===undefined?'':pool[chosen[i]];d.onclick=()=>{if(!solved&&chosen[i]!==undefined){chosen.splice(i,1);draw()}};el('slots').appendChild(d)});el('letters').innerHTML='';pool.forEach((ch,i)=>{let b=document.createElement('button');b.className='letter';b.textContent=ch;b.disabled=chosen.includes(i)||solved;b.style.opacity=b.disabled?'.3':'1';b.onclick=()=>{if(chosen.length<data[index][1].length){chosen.push(i);draw()}};el('letters').appendChild(b)})}function clearAnswer(){if(!solved){chosen=[];el('feedback').textContent='';draw()}}function check(){if(solved)return;if(chosen.length!==pool.length){el('feedback').textContent='أكمل ترتيب الحروف أولًا';return}if(chosen.map(i=>pool[i]).join('')===data[index][1]){solved=true;points+=10;el('feedback').textContent='🌟 إجابة صحيحة! حصلت على 10 نقاط';el('next').textContent=index===data.length-1?'عرض النتيجة':'السؤال التالي ←';el('next').classList.remove('hidden');draw()}else{el('feedback').textContent='حاول مرة أخرى، يمكنك إعادة ترتيب الحروف'}}function next(){if(index<data.length-1){index++;render()}else{el('hint').textContent='';el('slots').innerHTML='';el('letters').innerHTML='';el('next').classList.add('hidden');el('finish').classList.remove('hidden');el('result').textContent=`أنهيت الأنشطة وحصلت على ${points} من 80 نقطة.`}}function restart(){index=0;points=0;el('finish').classList.add('hidden');render()}function certificate(){let name=el('student').value.trim()||'الطالب المشارك';let w=window.open('','_blank');if(!w){alert('اسمح بفتح النوافذ المنبثقة لعرض الشهادة');return}w.document.write(`<html lang="ar" dir="rtl"><meta charset="utf-8"><title>شهادة مشاركة</title><body style="font-family:Tahoma;text-align:center;padding:70px;border:12px double #08765a"><h1>🏅 شهادة مشاركة</h1><h2>مشروع سِراج عُمان</h2><p>تُمنح هذه الشهادة إلى</p><h2>${name.replace(/[<>&]/g,'')}</h2><p>لمشاركته في تطبيق كلماتي العُمانية</p><h2>النتيجة: ${points} من 80</h2><p>مدرسة العهد للتعليم الأساسي (1–4)</p><button onclick="print()">طباعة الشهادة</button></body></html>`);w.document.close()}render();</script></body></html>
